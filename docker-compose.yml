version: '3.8'

networks:
  mainframe-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

services:
  # 1. Caddy Web Server & Reverse Proxy (Handles HTTPS, VPN proxying, and multi-network routing)
  caddy:
    image: caddy:2.7-alpine
    container_name: domail-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "7777:7777" # Nostr Relay websocket
    volumes:
      - ./index.html:/usr/share/caddy/index.html:ro
      - ./assets:/usr/share/caddy/assets:ro
      - ./core:/usr/share/caddy/core:ro
      - ./sw.js:/usr/share/caddy/sw.js:ro
      - ./manifest.webmanifest:/usr/share/caddy/manifest.webmanifest:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - mainframe-net

  # 2. Tor v3 Onion Service Daemon
  tor:
    image: goldy/tor-hidden-service:latest
    container_name: domail-tor
    restart: unless-stopped
    environment:
      - TOR_HS_PORTS=80:caddy:80
    volumes:
      - tor_data:/var/lib/tor/hidden_service
    networks:
      - mainframe-net

  # 3. I2P Router Daemon (i2pd)
  i2pd:
    image: purplei2p/i2pd:latest
    container_name: domail-i2pd
    restart: unless-stopped
    ports:
      - "7070:7070" # HTTP console
    volumes:
      - i2p_data:/home/i2pd/.i2pd
    networks:
      - mainframe-net

  # 4. Nostr Relay Daemon (strfry)
  nostr-relay:
    image: ghcr.io/hoytech/strfry:latest
    container_name: domail-nostr
    restart: unless-stopped
    volumes:
      - nostr_data:/app/strfry-db
    networks:
      - mainframe-net

  # 5. Yggdrasil IPv6 Mesh Overlay Daemon
  yggdrasil:
    image: yggdrasil/yggdrasil:latest
    container_name: domail-yggdrasil
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    volumes:
      - ygg_data:/etc/yggdrasil
    networks:
      - mainframe-net

  # 6. Radicle Seed Node (P2P Code Collaboration)
  radicle:
    image: radicle/radicle-node:latest
    container_name: domail-radicle
    restart: unless-stopped
    volumes:
      - radicle_data:/root/.radicle
    networks:
      - mainframe-net

volumes:
  tor_data:
  i2p_data:
  nostr_data:
  ygg_data:
  radicle_data:
