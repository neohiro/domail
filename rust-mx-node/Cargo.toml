[package]
name = "domail-mx-node"
version = "0.1.0"
edition = "2021"
description = "DOM Mail MX Node - Self-hosted mail server for WASM"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]
name = "mx_node"

[dependencies]
# Async runtime
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }

# TLS
rustls = { version = "0.23", features = ["dangerous_configuration", "logging"] }
rustls-pemfile = "1.0"
rcgen = { version = "0.12", features = ["pem"] }

# Email protocols
lettre = { version = "0.11", features = ["tokio1", "smtp", "transport"] }
async-imap = "0.17"
mail-builder = "0.12"
mail-parser = "0.12"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# WASM bindings
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["WebSocket", "Crypto", "SubtleCrypto", "AesGcmParams", "RsaHashedImportParams", "EcKeyImportParams", "HmacImportParams", "Pbkdf2Params", "AesKeyGenParams", "EcKeyGenParams", "RsaHashedKeyGenParams", "HmacKeyGenParams"] }

# Crypto
ring = "0.17"
x25519-dalek = "2.0"
ed25519-dalek = "2.0"
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand = { version = "0.8", features = ["std"] }
getrandom = { version = "0.2", features = ["js"] }

# Utilities
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
url = "2.5"
percent-encoding = "2.3"
idna = "0.5"
dns-lookup = "0.1"

# Transport
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
tokio-socks = "0.11"

[dependencies.web-sys]
version = "0.3"
features = [
  "WebSocket",
  "MessageEvent",
  "CloseEvent",
  "BinaryType",
  "Crypto",
  "SubtleCrypto",
  "CryptoKey",
  "AesGcmParams",
  "RsaHashedImportParams",
  "EcKeyImportParams",
  "HmacImportParams",
  "Pbkdf2Params",
  "AesKeyGenParams",
  "EcKeyGenParams",
  "RsaHashedKeyGenParams",
  "HmacKeyGenParams",
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "EventTarget",
  "Event",
  "CustomEvent",
  "Blob",
  "ArrayBuffer",
  "Uint8Array",
  "TextEncoder",
  "TextDecoder",
  "Console",
  "Performance",
]

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"

[profile.wasm]
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"