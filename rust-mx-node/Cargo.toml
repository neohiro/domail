[package]
name = "domail-mx-node"
version = "0.2.0"
edition = "2021"
description = "DOM Mail MX Node - Decentralized mail server with 13 transport vectors"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[lib]
crate-type = ["cdylib", "rlib"]
name = "mx_node"

[[bin]]
name = "mx-node"
path = "src/main.rs"
required-features = ["service"]

[features]
default = ["service"]
# Native OS-service mode: control API, OS service integration, full transport set.
service = []
# Browser (WebAssembly) mode.
wasm = [
  "dep:wasm-bindgen",
  "dep:wasm-bindgen-futures",
  "dep:js-sys",
  "dep:web-sys",
  "dep:serde-wasm-bindgen",
  "dep:console_log",
]
console_log = ["dep:console_log"]

[dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"

# Crypto
x25519-dalek = "2"
ed25519-dalek = "2"
chacha20poly1305 = "0.10"
argon2 = "0.5"
hkdf = "0.12"
sha2 = "0.10"
sha3 = "0.10"
hmac = "0.12"
aes = "0.8"
cbc = "0.1"
cipher = { version = "0.4", features = ["block-padding"] }
secp256k1 = { version = "0.29", features = ["rand", "std", "hashes"] }
rand = "0.8"
getrandom = { version = "0.2", features = ["js"] }
base64 = "0.22"
zeroize = { version = "1", features = ["derive"] }

# Utilities
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
async-trait = "0.1"
futures-util = "0.3"
mail-parser = "0.11"

# WASM bindings (browser build only)
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = [
  "WebSocket", "MessageEvent", "CloseEvent", "BinaryType",
  "Crypto", "SubtleCrypto", "CryptoKey",
  "AesGcmParams", "RsaHashedImportParams", "EcKeyImportParams",
  "HmacImportParams", "Pbkdf2Params", "AesKeyGenParams", "EcKeyGenParams",
  "HmacKeyGenParams",
  "Window", "Document", "Element", "HtmlElement",
  "EventTarget", "Event", "CustomEvent",
  "Blob",
  "TextEncoder", "TextDecoder", "console",
  "Performance"
] }
serde-wasm-bindgen = { version = "0.6", optional = true }
console_log = { version = "0.2", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = [
  "rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs",
  "signal", "process",
] }
tokio-socks = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1"
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = { version = "0.13", features = ["pem"] }
# `rustls-tls` keeps the build free of a system OpenSSL dependency.
lettre = { version = "0.11", default-features = false, features = [
  "tokio1", "smtp-transport", "pool", "hostname", "builder", "rustls-tls",
] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", default-features = false, features = [
  "rt", "macros", "sync", "time", "io-util",
] }
# ring needs the JS entropy shim when it is compiled for the browser.
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js"] }

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
strip = true

[profile.wasm]
inherits = "release"
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"
