name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run tests
        run: node --test test/core.test.mjs

      - name: Check required files
        run: |
          test -f index.html
          test -f assets/css/domail.css
          test -f assets/js/domail.js
          test -f core/mail.mjs
          test -f CNAME
          test -f LICENSE
          test -f README.md
          test -f SECURITY.md
          test -f CODE_OF_CONDUCT.md
          test -f ai-disclosure.md
          test -f robots.txt
          test -f _headers
          test -f .nojekyll
          test -f .gitattributes
          test -f manifest.webmanifest

      - name: Verify CNAME
        run: grep -q "domail.space" CNAME

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
